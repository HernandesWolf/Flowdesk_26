spring:
  application:
    name: flowdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowdesk}
    username: ${DB_USER:flowdesk}
    password: ${DB_PASSWORD:flowdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    tags-sorter: alpha

flowdesk:
  jwt:
    # DEV ONLY. Always override with a long random value (>= 32 bytes) via JWT_SECRET in real deployments.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  storage:
    path: ${STORAGE_PATH:./data/attachments}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  sla:
    urgent-hours: 4
    high-hours: 24
    medium-hours: 72
    low-hours: 168
    due-soon-minutes: 120
    check-interval-ms: 60000
